name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build consistency (parts → client.js)
        run: node build.mjs --check
      - name: Unit tests (node:test)
        run: node --test "test/*.test.js"
      - name: Component render smoke (rmsmoke)
        run: node rmsmoke.mjs
      - name: React mount test
        run: node tools/react-mount-test.mjs
      - name: MCP selftest
        run: node tools/mcp-server.mjs --selftest
      - name: Backend smoke (fake ctx, no network)
        run: node smoke.mjs
